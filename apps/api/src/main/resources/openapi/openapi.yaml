openapi: 3.1.0
info:
  title: Agency API
  description: |
    REST API for the IT Consulting & Services platform.
    Provides authentication, project management, booking, and CMS content endpoints.
  version: 0.1.0
  contact:
    name: Agency Support
    email: support@agency.example.com
  license:
    name: Proprietary
    url: https://agency.example.com/license

servers:
  - url: http://localhost:8080/api/v1
    description: Local development server
  - url: https://api.agency.example.com/api/v1
    description: Production server

tags:
  - name: auth
    description: Authentication endpoints (login, register, refresh, logout)
  - name: projects
    description: Project management (CRUD, progress, members)
  - name: tasks
    description: Task management within projects
  - name: milestones
    description: Project milestones
  - name: bookings
    description: Consultation booking and scheduling
  - name: cms
    description: Content management (case studies, blog posts, pages)
  - name: files
    description: File upload and management

paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Register a new user
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already registered

  /auth/login:
    post:
      tags: [auth]
      summary: Authenticate user with email and password
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials

  /auth/refresh:
    post:
      tags: [auth]
      summary: Refresh access token using refresh token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid or expired refresh token

  /auth/logout:
    post:
      tags: [auth]
      summary: Logout and revoke refresh token
      operationId: logoutUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /auth/me:
    get:
      tags: [auth]
      summary: Get current user profile
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '401':
          description: Unauthorized

  /projects:
    get:
      tags: [projects]
      summary: List projects (paginated)
      operationId: listProjects
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 0
        - in: query
          name: size
          schema:
            type: integer
            default: 20
            maximum: 100
        - in: query
          name: status
          schema:
            type: string
            enum: [DISCOVERY, PLANNING, IN_PROGRESS, REVIEW, DELIVERED, ARCHIVED]
        - in: query
          name: clientId
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Paginated project list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjectResponse'

    post:
      tags: [projects]
      summary: Create a new project
      operationId: createProject
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '200':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          description: Validation error
        '403':
          description: Forbidden - insufficient permissions

  /projects/{id}:
    get:
      tags: [projects]
      summary: Get project by ID
      operationId: getProject
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Project details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '404':
          description: Project not found

    put:
      tags: [projects]
      summary: Update project
      operationId: updateProject
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: Project updated
        '404':
          description: Project not found

    delete:
      tags: [projects]
      summary: Archive (soft delete) a project
      operationId: deleteProject
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Project archived
        '404':
          description: Project not found

  /projects/{id}/progress:
    get:
      tags: [projects]
      summary: Get project progress summary
      operationId: getProjectProgress
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Project progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectProgress'

  /bookings:
    get:
      tags: [bookings]
      summary: List current user's bookings
      operationId: listBookings
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [PENDING, CONFIRMED, CANCELLED, COMPLETED, NO_SHOW]
      responses:
        '200':
          description: List of bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookingResponse'

    post:
      tags: [bookings]
      summary: Create a consultation booking
      operationId: createBooking
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
      responses:
        '200':
          description: Booking created
        '400':
          description: Validation error
        '409':
          description: Slot already booked

  /bookings/slots:
    get:
      tags: [bookings]
      summary: List available booking slots
      operationId: listBookingSlots
      parameters:
        - in: query
          name: hostId
          schema:
            type: string
            format: uuid
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Available slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookingSlotResponse'

  /cms/case-studies:
    get:
      tags: [cms]
      summary: List published case studies
      operationId: listCaseStudies
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 0
        - in: query
          name: size
          schema:
            type: integer
            default: 20
        - in: query
          name: technology
          schema:
            type: string
      responses:
        '200':
          description: Paginated case studies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCaseStudyResponse'

  /cms/case-studies/{slug}:
    get:
      tags: [cms]
      summary: Get case study by slug (public)
      operationId: getCaseStudyBySlug
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Case study details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseStudyResponse'
        '404':
          description: Case study not found

  /cms/blog:
    get:
      tags: [cms]
      summary: List published blog posts
      operationId: listBlogPosts
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 0
        - in: query
          name: size
          schema:
            type: integer
            default: 20
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: tag
          schema:
            type: string
      responses:
        '200':
          description: Paginated blog posts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBlogPostResponse'

  /cms/blog/{slug}:
    get:
      tags: [cms]
      summary: Get blog post by slug (public)
      operationId: getBlogPostBySlug
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Blog post details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlogPostResponse'

  /files/presigned-url:
    post:
      tags: [files]
      summary: Get presigned URL for direct file upload
      operationId: getPresignedUrl
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignedUrlRequest'
      responses:
        '200':
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedUrlResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained from /auth/login

  schemas:
    RegisterRequest:
      type: object
      required: [email, password, fullName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
        fullName:
          type: string
          minLength: 2
          maxLength: 100
        locale:
          type: string
          default: "en"

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    AuthResponse:
      type: object
      required: [accessToken, refreshToken, expiresIn, tokenType, user]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          description: Seconds until expiration
        tokenType:
          type: string
          example: "Bearer"
        user:
          $ref: '#/components/schemas/UserDto'

    UserDto:
      type: object
      required: [id, email, fullName, roles, permissions, mfaEnabled]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        avatarUrl:
          type: string
        locale:
          type: string
        timezone:
          type: string
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        mfaEnabled:
          type: boolean

    ErrorResponse:
      type: object
      required: [timestamp, status, error, message, path]
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
        requestId:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'

    ValidationError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
        rejectedValue:
          type: string

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    CreateProjectRequest:
      type: object
      required: [clientId, name]
      properties:
        clientId:
          type: string
          format: uuid
        managerId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 3
          maxLength: 100
        description:
          type: string
          maxLength: 5000
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        budgetCents:
          type: integer
          minimum: 0
        currency:
          type: string
          default: "USD"
        repositoryUrl:
          type: string
          format: uri

    ProjectResponse:
      type: object
      required: [id, name, slug, status, currency, clientId, progress, milestoneCount, taskCount, completedTaskCount, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [DISCOVERY, PLANNING, IN_PROGRESS, REVIEW, DELIVERED, ARCHIVED]
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        budgetCents:
          type: integer
        currency:
          type: string
        repositoryUrl:
          type: string
        clientId:
          type: string
          format: uuid
        managerId:
          type: string
          format: uuid
        progress:
          type: integer
          minimum: 0
          maximum: 100
        milestoneCount:
          type: integer
        taskCount:
          type: integer
        completedTaskCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UpdateProjectRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
        description:
          type: string
        status:
          type: string
          enum: [DISCOVERY, PLANNING, IN_PROGRESS, REVIEW, DELIVERED, ARCHIVED]
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        budgetCents:
          type: integer
        currency:
          type: string
        repositoryUrl:
          type: string

    PaginatedProjectResponse:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ProjectResponse'
        page:
          $ref: '#/components/schemas/PageInfo'

    PageInfo:
      type: object
      required: [number, size, totalElements, totalPages]
      properties:
        number:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer

    ProjectProgress:
      type: object
      required: [overallProgress, milestoneProgress, taskStats]
      properties:
        overallProgress:
          type: integer
        milestoneProgress:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              progress:
                type: integer
        taskStats:
          type: object
          properties:
            total:
              type: integer
            completed:
              type: integer
            inProgress:
              type: integer
            blocked:
              type: integer
        upcomingMilestones:
          type: array
          items:
            $ref: '#/components/schemas/MilestoneResponse'

    MilestoneResponse:
      type: object
      required: [id, name, status, sortOrder, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        status:
          type: string
        dueDate:
          type: string
          format: date
        completedAt:
          type: string
          format: date-time
        sortOrder:
          type: integer

    CreateBookingRequest:
      type: object
      required: [slotId]
      properties:
        slotId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        notes:
          type: string
          maxLength: 1000

    BookingResponse:
      type: object
      required: [id, clientId, slotId, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        clientId:
          type: string
          format: uuid
        slotId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, CONFIRMED, CANCELLED, COMPLETED, NO_SHOW]
        notes:
          type: string
        meetingUrl:
          type: string
        reminderSent:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BookingSlotResponse:
      type: object
      required: [id, hostId, title, durationMinutes, startAt, endAt, isActive, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        hostId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        durationMinutes:
          type: integer
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        timezone:
          type: string
        maxBookings:
          type: integer
        currentBookings:
          type: integer
        isRecurring:
          type: boolean
        locationType:
          type: string
          enum: [VIDEO, PHONE, IN_PERSON]
        isActive:
          type: boolean

    CaseStudyResponse:
      type: object
      required: [id, title, slug, summary, content, status, authorId, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        summary:
          type: string
        content:
          type: string
        clientName:
          type: string
        clientLogoUrl:
          type: string
        industry:
          type: string
        technologies:
          type: array
          items:
            type: string
        results:
          type: string
        featuredImage:
          type: string
        galleryImages:
          type: array
          items:
            type: string
        status:
          type: string
        publishedAt:
          type: string
          format: date-time
        authorId:
          type: string
          format: uuid
        seoTitle:
          type: string
        seoDescription:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PaginatedCaseStudyResponse:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/CaseStudyResponse'
        page:
          $ref: '#/components/schemas/PageInfo'

    BlogPostResponse:
      type: object
      required: [id, title, slug, excerpt, content, status, authorId, viewCount, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        excerpt:
          type: string
        content:
          type: string
        featuredImage:
          type: string
        authorId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        status:
          type: string
        publishedAt:
          type: string
          format: date-time
        seoTitle:
          type: string
        seoDescription:
          type: string
        readingTimeMin:
          type: integer
        viewCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PaginatedBlogPostResponse:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/BlogPostResponse'
        page:
          $ref: '#/components/schemas/PageInfo'

    PresignedUrlRequest:
      type: object
      required: [filename, contentType, sizeBytes, purpose]
      properties:
        filename:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
        purpose:
          type: string
          enum: [PROJECT_DELIVERABLE, CASE_STUDY_IMAGE, AVATAR, DOCUMENT]

    PresignedUrlResponse:
      type: object
      required: [uploadUrl, fileId, expiresAt]
      properties:
        uploadUrl:
          type: string
        fileId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time